<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';connect-src 'self';base-uri 'none';form-action 'self'"><title>個人アカウント管理｜配信主用</title><link rel="stylesheet" href="rpg.css?v=240"><link rel="stylesheet" href="account.css?v=243"><script src="account-admin.js?v=243" defer></script></head><body><header><a href="index.html">← ホームへ</a><a href="account.html">マイページへ →</a></header><main><p class="eyebrow">FOR THE BROADCASTER</p><h1>冒険者の鍵を、<br>一人ずつ。</h1><p class="muted">管理専用トークンで操作します。街同期トークンとは別です。入力したキーはこのページを閉じるまでのメモリだけで保持し、端末へ保存しません。</p><form id="adminLogin"><label>RPG_ACCOUNT_ADMIN_TOKEN<input id="adminKey" type="password" required minlength="32" maxlength="1024" autocomplete="off"></label><button id="connect">管理画面を開く</button></form><p id="adminStatus" role="status" aria-live="polite"></p>
<section id="credentialPanel" class="credential-panel" hidden><h2>今回発行した秘密のパス</h2><p class="muted">ここでしか確認できません。配信画面や共有フォルダに表示・保存せず、本人へ個別に渡してください。通信が途切れて受け取れなかったパスは、再発行してください。</p><pre id="credentials"></pre><button id="downloadPasses">配布用テキストを保存</button><label class="account-check"><input id="savedPasses" type="checkbox">パスを保存、または本人へ渡しました</label><button id="clearPasses" disabled>パスの表示を消す</button></section>
<section id="management" class="panel" hidden><div class="admin-tools"><button id="reload">一覧を更新</button><button id="issueMissing">未発行の人へ発行（最大20人）</button><button id="disconnect">管理画面を閉じる</button></div><label>表示名で検索<input id="accountSearch" type="search" maxlength="100"></label><p id="accountCounts" class="muted"></p><div id="accountList"></div><div class="pager" id="accountPager"></div></section></main></body></html>
