<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>キャラ作成｜柚の世界</title>
<link rel="stylesheet" href="rpg.css?v=284">
<link rel="stylesheet" href="rpg-world-theme.css?v=284">
<link rel="stylesheet" href="rpg-guide.css?v=284">
<link rel="stylesheet" href="rpg-character.css?v=295">
<script src="rpg-character.js?v=296" type="module"></script>
</head>
<body>
<header><a href="account.html">← マイページ</a><a href="/idle-world#activities">オート冒険へ →</a></header>
<main class="guide"><section class="hero"><p class="eyebrow">ADVENTURER'S PORTRAIT</p><h1>キャラ作成</h1><p>柚の世界を旅する、自分だけの姿を作れます。</p></section>
<section class="panel"><p id="characterStatus" role="status">ログイン状態を確認しています…</p><a id="characterLogin" href="account.html#character" hidden>マイページでログインする →</a>
<form id="characterForm" hidden>
<div id="characterPreview" class="character-preview" aria-label="キャラクターのプレビュー"></div>
<div class="character-fields">
<label>色<select name="color"><option value="original">オリジナル</option><option value="warm">夕焼け</option><option value="cool">水色</option><option value="violet">藤色</option></select></label>
<label>アクセサリー<select name="accessory"><option value="none">なし</option><option value="leaf">若葉</option><option value="star">星飾り</option><option value="ribbon">リボン</option></select></label>
<label>性別（任意・自分にだけ表示）<select name="gender"><option value="unset">未設定</option><option value="male">男性</option><option value="female">女性</option><option value="nonbinary">ノンバイナリー</option><option value="private">回答しない</option></select></label>
</div>
<section aria-labelledby="lookTitle">
<h2 id="lookTitle">外見を選ぶ</h2><p id="lookSelected"></p>
<p>性別は候補の表示だけに使います。いつでも無料で変更できます。</p>
<div class="character-fields">
<label>外見名で検索<input id="lookSearch" type="search" placeholder="騎士、料理人など"></label>
<label>テーマ<select id="lookTheme"><option value="">すべて</option><option>戦闘</option><option>魔法</option><option>探索</option><option>暮らし</option></select></label>
<label class="character-check"><span><input id="lookFavorites" type="checkbox"> お気に入りだけ表示</span></label>
</div><p id="lookCount" role="status"></p><div class="look-grid" id="lookGrid"></div>
<button type="button" id="lookMore" hidden>さらに12種を表示</button>
</section>
<details><summary>自分の画像を使う</summary>
<label>自分の画像（PNG・JPEG・WebP、10 MBまで）<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label>
<p>画像を使うと、冒険中の自分のキャラに表示します。街の住人として画像を公開済みの場合、その住人画像も更新されます。</p>
<button id="removeCharacterImage" type="button">画像を外す</button></details>
<label class="character-check"><input name="shareImage" type="checkbox">おまかせ同行のとき、仲間に自分の姿を見せる</label>
<label class="character-check"><input name="publicLook" type="checkbox">選んだ外見をステータス・街で公開する</label>
<div class="look-actions"><button type="submit">キャラを保存</button></div>
<p role="status" id="characterSavedText" tabindex="-1"></p>
<nav id="characterSaved" aria-label="保存後に進む" hidden>
<a href="account.html">マイページへ戻る →</a>　<a href="/idle-world#activities">オート冒険へ →</a>
</nav>
</form></section>
</main></body></html>
